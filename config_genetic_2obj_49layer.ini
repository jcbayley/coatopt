[general]
save_dir = /data/www.astro/jcb18j/coatopt/paper_runs/
materials_path = /data/www.astro/jcb18j/coatopt/paper_runs/materials_1064.json
materials = SiO2, Ti:Ta2O5     
substrate_material = SiO2
run_name = pop4000_gen50_cp0_9_ce30_mp0_3_me30_8_9s
disable_mlflow = False
mlflow_log_freq = 20

[sweep]
metric = hypervolume
direction = maximize
n_startup_trials = 5
param_sb3_discrete.epochs_per_step = {'type': 'int', 'min': 500, 'max': 2000}
param_algorithm.ent_coef = {'type': 'float', 'min': 0.01, 'max': 0.1}

[nsga2]
population_size = 600
n_generations = 400
seed = 1001
crossover_probability = 0.9
crossover_eta = 15
mutation_probability = 0.013
mutation_eta = 20
eliminate_duplicates = True
algorithm = NSGA2
min_layers_before_air = 2
mask_consecutive_materials = true
verbose = 1
plot_freq = 5000

[data]
n_layers = 38
min_thickness = 0.1
max_thickness = 0.4
use_optical_thickness = True
optimise_parameters = ["reflectivity", "absorption"]
optimise_targets = {"reflectivity": 1.0, "absorption": 0.0, "thermal_noise":1e-23}
objective_bounds = {"reflectivity": [0.0, 0.99999999], "absorption": [1000, 0.1], "thermal_noise":[1e-24, 1e-19]}
combine = sum
use_reward_normalisation = True
reward_normalisation_apply_clipping = False
apply_air_penalty = True
air_penalty_weight = 0.5
enforce_objective_bounds = False
objective_bounds_penalty_weight = 0.1
compute_efi = True
ignore_air_option = False
ignore_substrate_option = False
use_intermediate_reward = False
apply_preference_constraints = True
constraint_schedule = "interleaved"

[training]
cycle_weights = random

[condor]
num_runs = 10
generate_comparison = True
project_path = /home/jcb18j/projects/coatopt/
results_dir = /data/www.astro/jcb18j/coatopt/paper_runs
uv_executable = /home/jcb18j/.local/bin/uv
output_dir = genetic_2obj_38_5
request_cpus = 1
request_memory = 4GB
request_disk = 1GB

