[general]
# Base directory for results
save_dir = /Users/simon/Library/CloudStorage/GoogleDrive-simon.tait@ligo.org/My Drive/BackupFromDropbox/Python/coatopt/TiGe_Testing_GatekeeperAnneal

# Materials file path
materials_path = /Users/simon/Library/CloudStorage/GoogleDrive-simon.tait@ligo.org/My Drive/BackupFromDropbox/Python/coatopt/experiments/materials.json

# Optional: append custom name to run directory
run_name = TiGe_ChirpedTesting-GatekeeperAnneal

# Logging
disable_mlflow = True
mlflow_log_freq = 20

[sweep]
metric = hypervolume
direction = maximize
n_startup_trials = 5
param_sb3_discrete.epochs_per_step = {'type': 'int', 'min': 500, 'max': 2000}
param_algorithm.ent_coef = {'type': 'float', 'min': 0.01, 'max': 0.1}

[hppo_sequential]
# --- TRAINING MODE CONFIGURATION ---
# To toggle between a fast prototype/toy run and a full production run, comment/uncomment the sections below.

# Options A: Fast Toy / Trialling Run (Roughly 10-15 minutes, 8k episodes)
total_episodes              = 8000
warmup_episodes             = 1000
episodes_per_step           = 200
steps_per_objective         = 10
episodes_per_update         = 4

# Options B: Full Production Run (Original schedule, 90k episodes)
# total_episodes              = 90000
# warmup_episodes             = 15000
# episodes_per_step           = 4000
# steps_per_objective         = 10
# episodes_per_update         = 4

n_epochs                    = 32
batch_size                  = 16
constraint_penalty          = 5.0
randomise_constraints       = true
pareto_bonus                = 0.0
lr                          = 1e-4
lr_final                    = 1e-5
lr_decay_episodes           = 100000
ent_coef                    = 0.01
ent_coef_final              = 0.01
ent_decay_episodes          = 100000
restart_decay_on_phase      = true
verbose                     = 1
plot_freq                   = 1000

# Behavior cloning
bc_weight                   = 0.05

# Policy architecture
use_lstm                    = True
lstm_hidden                 = 32
lstm_layers                 = 2
hidden                      = [32, 32, 32]

# Search bounds
min_layers_before_air       = 40
mask_consecutive_materials  = true
seed                        = 42

[data]
# --- LAYER DEFINITION ---
# Options A: Fast Toy / Trialling Run (20 layers for fast convergence)
n_layers              = 20

# Options B: Full Production Run (60 layers)
# n_layers              = 60

min_thickness         = 0.1
max_thickness         = 0.4
use_optical_thickness = True

# Optimization objectives
optimise_parameters = ["reflectivity", "absorption", "thermal_noise"]
optimise_targets    = {"reflectivity": 1.0, "absorption": 0.0, "thermal_noise": 1e-22}
objective_bounds    = {"reflectivity": [0.0, 0.999999], "absorption": [50000, 1e-3], "thermal_noise": [1e-24, 1e-15]}

# Reward settings
combine                             = sum
use_reward_normalisation            = True
reward_normalisation_apply_clipping = False
apply_air_penalty                   = True
air_penalty_weight                  = 1

# --- GATEKEEPER ANNEALING SETTINGS ---
reflectivity_gatekeeper_threshold   = 0.999
reflectivity_gatekeeper_initial_threshold = 0.95

enforce_objective_bounds        = False
objective_bounds_penalty_weight = 0.1
compute_efi = True

# Other settings
ignore_air_option            = False
ignore_substrate_option      = False
use_intermediate_reward      = False
apply_preference_constraints = True
constraint_schedule          = "interleaved"

[training]
cycle_weights = random

[condor]
materials_file = ./materials.json
num_runs = 10
generate_comparison = True
project_path = /home/jcb18j/projects/coatopt/
results_dir = /data/www.astro/jcb18j/coatopt/3mat
uv_executable = /home/jcb18j/.local/bin/uv
output_dir = condor_3obj_30_1
request_cpus = 1
request_memory = 4GB
request_disk = 1GB
