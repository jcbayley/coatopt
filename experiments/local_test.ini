[general]
save_dir = runs
materials_path = experiments/materials.json
run_name = local_test_run_3
disable_mlflow = True
mlflow_log_freq = 1

[hppo_sequential]
total_episodes = 5
warmup_episodes = 2
episodes_per_step = 1
steps_per_objective = 1
episodes_per_update = 1
n_epochs = 1
batch_size = 1
constraint_penalty = 5.0
randomise_constraints = true
pareto_bonus = 0.0
lr = 1e-4
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.05
ent_coef = 0.01
vf_coef = 1.0
max_grad_norm = 0.5
bc_weight = 0.05
lr_final = 1e-5
lr_decay_episodes = 5
ent_coef_final = 0.01
ent_decay_episodes = 5
restart_decay_on_phase = true
use_lstm = True
lstm_hidden = 8
lstm_layers = 1
hidden = [16, 16]
min_layers_before_air = 2
mask_consecutive_materials = true
seed = 42
verbose = 1
plot_freq = 2

[data]
n_layers = 5
min_thickness = 0.1
max_thickness = 0.4
use_optical_thickness = True
optimise_parameters = ["reflectivity", "absorption", "thermal_noise"]
optimise_targets = {"reflectivity": 1.0, "absorption": 0.0, "thermal_noise":1e-22}
objective_bounds = {"reflectivity": [0.0, 0.9999999999], "absorption": [50000, 1e-3], "thermal_noise":[1e-22, 1e-15]}
combine = sum
use_reward_normalisation = True
reward_normalisation_apply_clipping = False
apply_air_penalty = True
air_penalty_weight = 0.5
enforce_objective_bounds = False
objective_bounds_penalty_weight = 0.1
compute_efi = True
ignore_air_option = False
ignore_substrate_option = False
use_intermediate_reward = False
apply_preference_constraints = True
constraint_schedule = "interleaved"

[training]
cycle_weights = random
