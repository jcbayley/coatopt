[general]
# base dir 
save_dir =/Users/simon/Library/CloudStorage/GoogleDrive-simon.tait@ligo.org/My Drive/BackupFromDropbox/Python/coatopt/TiGe_Testing_ReflectivityGate_3

# materials file 
materials_path  = /Users/simon/Library/CloudStorage/GoogleDrive-simon.tait@ligo.org/My Drive/BackupFromDropbox/Python/coatopt/experiments/TiGE_materials.json
# Optional: append custom name to run directory 
run_name        = TiGe_ChirpedTesting-ReflectivityGatekeeper
# Disable MLflow logging (default: True) 
disable_mlflow  = True
mlflow_log_freq = 20

[sweep]
# Hyperparameter sweep configuration 
metric      = hypervolume
direction   = maximize

# Active sweep parameters 
n_startup_trials                    = 5
param_sb3_discrete.epochs_per_step  = {'type': 'int', 'min': 500, 'max': 2000}
param_algorithm.ent_coef            = {'type': 'float', 'min': 0.01, 'max': 0.1}

[hppo_sequential]
total_episodes              = 90000
warmup_episodes             = 15000
episodes_per_step           = 4000
steps_per_objective         = 10
episodes_per_update         = 4
n_epochs                    = 32
batch_size                  = 16
constraint_penalty          = 5.0
randomise_constraints       = true
pareto_bonus                = 0.0
lr                          = 1e-4
gamma                       = 0.99
gae_lambda                  = 0.95
clip_range                  = 0.05
ent_coef                    = 0.01
vf_coef                     = 1.0
max_grad_norm               = 0.5

bc_weight                   = 0.05

lr_final               = 1e-5
lr_decay_episodes      = 100000
ent_coef_final         = 0.01
ent_decay_episodes     = 100000
restart_decay_on_phase = true

use_lstm    = True
lstm_hidden = 32
lstm_layers = 2
hidden      = [32, 32, 32]

min_layers_before_air      = 30
mask_consecutive_materials = true
seed                       = 42
verbose                    = 1
plot_freq                  = 5000


[data]
# Layer configuration 
n_layers              = 50
min_thickness         = 0.1
max_thickness         = 0.4
use_optical_thickness = True

# Optimization objectives 
optimise_parameters = ["reflectivity", "absorption", "thermal_noise"]
optimise_targets    = {"reflectivity": 1.0, "absorption": 0.0, "thermal_noise":1e-22}
objective_bounds    = {"reflectivity": [0.0, 0.999999], "absorption": [50000, 1e-3], "thermal_noise":[1e-24, 1e-15]}

# Reward settings 
combine                             = sum
use_reward_normalisation            = True
reward_normalisation_apply_clipping = False
apply_air_penalty                   = True
air_penalty_weight                  = 1
reflectivity_gatekeeper_threshold   = 0.99

enforce_objective_bounds        = False
objective_bounds_penalty_weight = 0.1

compute_efi = True

# Other settings 
ignore_air_option            = False
ignore_substrate_option      = False
use_intermediate_reward      = False
apply_preference_constraints = True
constraint_schedule          = "interleaved"

[training]
cycle_weights = random

[condor]
# Path to materials file (relative to where you submit) 
materials_file = ./materials.json

# Number of parallel runs 
num_runs = 10

generate_comparison = True
# Project path on the execution machine 
project_path = /home/jcb18j/projects/coatopt/

# Directory where results are saved (will be transferred back) 
# Can be relative (runs/) or absolute path (/full/path/to/results/) 
results_dir = /data/www.astro/jcb18j/coatopt/3mat

# Path to uv executable on execution machine 
uv_executable = /home/jcb18j/.local/bin/uv

# Output directory for generated submit/DAG files (optional, defaults to condor_runs) 
output_dir = condor_3obj_30_1

# Resource requirements (optional) 
request_cpus = 1
request_memory = 4GB
request_disk = 1GB